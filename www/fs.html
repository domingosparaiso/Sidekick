<html>
<head>
 <link rel="stylesheet" href="style.css">
 <style>
	.filelist {
		background-color: #505058;
		border-bottom: 1px solid #000000;
	}
 </style>
</head>
<body>
<div id='bodydiv'>
<div><img src='logo.jpg' width='300' height='73' onerror="this.style.display='none'"></div>
<h1>File Upload</h1>
<a href=/>Home</a>&nbsp;&nbsp;<a href=# onclick='formatar();'>Format flash</a>
<hr>
<div id='entrypoint'>
<form id='upform' method='POST' enctype='multipart/form-data'>
<div class='container-box'>
<div class='labelup'>
<label for='fileup'>Choose file...</label>
<input name='file' type='file' id='fileup' class='hide-item' multiple>
</div>
<div class='box' id='fname'></div>
<div class='labelup' onclick="submit_form();">Upload</div>
<input type='submit' class='hide-item' value='Upload'>
</div>
</form>
</div>
<div id='percent'></div>
<hr>
<div id='filelist'></div>
<div id='confirmModal' class='modal-overlay'>
<div class='modal-box'>
<div id='confirmMessage' class='modal-message'></div>
<div class='modal-actions'>
<div class='modal-btn' onclick='modalCancel();'>Cancel</div>
<div class='modal-btn modal-btn-confirm' onclick='modalConfirm();'>Confirm</div>
</div>
</div>
</div>
<script>
const button = document.getElementById('fileup');
const fname = document.getElementById('fname');
button.addEventListener('change', () => {
  list = '';
  sep = '';
  for (const file of button.files) {
    list += sep + file.name + ' (' + file.size + ')';
    sep = ', ';
  }
  fname.innerHTML = list;
});
const form = document.querySelector('form');
form.addEventListener('submit', handleSubmit);
fetch('/filelist', {
	method: 'GET'
})
.then(response => {
	if (!response.ok) throw new Error(`Erro: ${response.status}`);
	return response.json();
})
.then(data => {
	result = '<table border=0 class=\"filelist\">';
	for(item of data.list) {
		result += "<tr><td><img style=\"cursor:pointer\" onclick='fdel(\"" + item.file + "\")' src='trash.png'></td><td>" + item.file + "</td><td>" + item.size + "</td></tr>";
	}
	document.getElementById('filelist').innerHTML = result + "</table>";
})
;

function handleSubmit(event) {
    event.preventDefault();
    submit_form();
}
function submit_form() {
    const url = '/fs-upload';
    const method = 'post';
    const xhr = new XMLHttpRequest();
    const data = new FormData(form);
    xhr.upload.addEventListener('progress', (event) => {
      document.getElementById('percent').innerHTML = 'Progress: ' + ((event.loaded / event.total) * 100).toFixed(2,) + '%';
      if(event.loaded == event.total) {
        setTimeout(function() {
          location.reload();
        }, 1000);
      }
    });
    xhr.open(method, url);
    xhr.send(data);
    document.getElementById('entrypoint').style.display = "none";
}
function fdel(fname) {
	console.log('Delete: ' + fname);
	const url = '/delete?arq=' + fname;
	showConfirm('Delete file ' + fname + ' from filesystem, confirm?', function() {
		const xhr = new XMLHttpRequest();
		xhr.open('GET', url);
		xhr.send();
		setTimeout(function() {
			location.reload();
		}, 1500);
	});
}
function formatar() {
  showConfirm('This will be wipe all configurations and files on the storage, confirm?', function() {
    window.location.href = '/format';
  });
}
let modalCallback = null;
function showConfirm(message, callback) {
	document.getElementById('confirmMessage').innerHTML = message;
	modalCallback = callback;
	document.getElementById('confirmModal').classList.add('modal-show');
}
function modalConfirm() {
	document.getElementById('confirmModal').classList.remove('modal-show');
	if(modalCallback) {
		modalCallback();
	}
	modalCallback = null;
}
function modalCancel() {
	document.getElementById('confirmModal').classList.remove('modal-show');
	modalCallback = null;
}
</script>
